name: Pick Debug
on:
  workflow_dispatch:
jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -q yfinance pandas numpy
      - name: Run picker
        run: python scripts/pick_daily_stocks.py
      - name: Show STOCK_LIST
        run: echo "STOCK_LIST=$STOCK_LIST"
